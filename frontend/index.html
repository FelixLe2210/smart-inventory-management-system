<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Inventory - Demand Forecasting & Reorder Recommendation</title>

    <meta name="color-scheme" content="light dark" />
    <!-- Áp chế độ sáng/tối trước khi vẽ trang để không bị nháy -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('smart_inventory_theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
