server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API: chuyển sang backend (AI service chỉ backend gọi, không mở ra ngoài)
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 130s;   # tính đề xuất bằng AI có thể mất vài chục giây
  }

  # WebSocket thời gian thực
  location /ws/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;   # giữ kết nối dài; client gửi ping mỗi 25s
  }

  # SPA: mọi đường dẫn khác trả index.html
  location / {
    try_files $uri /index.html;
  }
}
