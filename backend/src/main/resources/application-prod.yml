# Profile production: không có giá trị mặc định cho bí mật, thiếu biến môi trường thì ứng dụng không khởi động.
# Chạy:  SPRING_PROFILES_ACTIVE=prod  DB_URL=... DB_USERNAME=... DB_PASSWORD=... JWT_SECRET=<>=32 ký tự ngẫu nhiên>
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
  flyway:
    enabled: true
    baseline-on-migrate: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    org.hibernate.SQL: warn
    org.flywaydb: info
